<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movimiento Dejando Huella</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000;
      overflow-x: hidden;
    }

    /* Hero Section */
    .hero {
      position: relative;
      text-align: center;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url("LOGO.png") center/contain no-repeat, linear-gradient(rgba(35,114,163,0.8), rgba(35,114,163,0.8));
      background-blend-mode: overlay;
      color: #fff;
      flex-direction: column;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      max-width: 600px;
    }

    .btn {
      background-color: #ffdb4a;
      color: #000;
      padding: 12px 30px;
      border: none;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #fff;
      color: #2372a3;
    }

    /* Redes Sociales */
    .social {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .social a {
      color: white;
      text-decoration: none;
      font-size: 1.8rem;
      transition: transform 0.3s, color 0.3s;
    }

    .social a:hover {
      transform: scale(1.2);
      color: #ffdb4a;
    }

    footer {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2rem;
      }
      .hero p {
        font-size: 1rem;
      }
    }

    @media (max-width: 480px) {
      .hero {
        padding: 20px;
      }
      .hero h1 {
        font-size: 1.6rem;
      }
      .btn {
        padding: 10px 20px;
      }
    }
  </style>

  <!-- ICONOS DE REDES -->
  <script src="https://kit.fontawesome.com/4f1f44a3a2.js" crossorigin="anonymous"></script>
</head>
<body>

  <section class="hero">
    <h1>Movimiento Dejando Huella</h1>
    <p>Conectando personas, transformando vidas. Un movimiento para el crecimiento personal, emocional y espiritual.</p>
    <a href="https://forms.gle/132ronj7wu3hnbhe8" target="_blank" class="btn">Descubre Más</a>

    <div class="social">
      <a href="https://www.facebook.com/" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a>
      <a href="https://www.instagram.com/" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://www.youtube.com/" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
      <a href="https://wa.me/573001112233" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
    </div>
  </section>

  <footer>
    © 2025 Movimiento Dejando Huella. Todos los derechos reservados.
  </footer>
</body>
</html>
